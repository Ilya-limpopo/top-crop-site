<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Crop — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #f0f9eb;
  color: #0a2014;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 380px;
  padding: 52px 44px 44px;
  background: #fff;
  border: 1px solid #d8edd4;
  border-radius: 4px;
}
.logo-wrap {
  text-align: center;
  margin-bottom: 40px;
}
.logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #0a2014;
}
.logo-sub {
  font-size: 8px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #2b8c30;
  margin-top: 3px;
}
.admin-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #8ab496;
  margin-top: 14px;
}
label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8ab496;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d4e8d0;
  border-radius: 2px;
  font-size: 14.5px;
  font-family: 'DM Sans', sans-serif;
  color: #0a2014;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 18px;
}
input:focus { border-color: #2b8c30; }
input::placeholder { color: #bdd4ba; }
button[type="submit"] {
  width: 100%;
  padding: 14px;
  background: #f5c800;
  color: #1a1100;
  border: none;
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.22s ease;
  margin-top: 6px;
}
button[type="submit"]:hover {
  background: #ffd400;
  transform: translateY(-2px) scale(1.025);
  box-shadow: 0 8px 28px rgba(245,196,0,0.38);
}
button[type="submit"]:active {
  transform: translateY(0) scale(0.98);
  box-shadow: none;
}
.error {
  font-size: 12px;
  color: #c0392b;
  margin-top: 14px;
  text-align: center;
  min-height: 18px;
  letter-spacing: 0.02em;
}
.back-link {
  display: block;
  text-align: center;
  margin-top: 28px;
  font-size: 12px;
  color: #8ab496;
  text-decoration: none;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}
.back-link:hover { color: #2b8c30; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo">TOP CROP</div>
    <div class="logo-sub">Tanzania</div>
    <div class="admin-label">Admin Panel</div>
  </div>
  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@topcrop.tz" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <a href="Top Crop.html" class="back-link">← View Website</a>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');
  if (email === 'admin@topcrop.tz' && password === 'topcrop2024') {
    sessionStorage.setItem('tc_admin', '1');
    window.location.href = 'admin/dashboard.html';
  } else {
    err.textContent = 'Invalid email or password.';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
document.getElementById('email').addEventListener('input', () => {
  document.getElementById('errorMsg').textContent = '';
});
document.getElementById('password').addEventListener('input', () => {
  document.getElementById('errorMsg').textContent = '';
});
</script>
</body>
</html>
