    '--fg':       '#edf8ed',

function applyTheme(t) {
  const vars = THEMES[t] || THEMES.dark;
  const root = document.documentElement.style;
  Object.entries(vars).forEach(([k, v]) => root.setProperty(k, v));
}

  'banana plantation rows':  'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=1400&q=82&fit=crop&auto=format',
  'palm tree canopy':        'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=700&q=82&fit=crop&auto=format',

function Img({ label, style = {} }) {
  const [err, setErr] = useState(false);
  const src = PHOTOS[label];
  if (src && !err) {
    return (
      <div style={{ overflow:'hidden', flexShrink:0, ...style }}>
        <img
          src={src} alt={label}
          onError={() => setErr(true)}
          style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', transition:'transform 0.5s ease' }}
          onMouseEnter={e => e.target.style.transform='scale(1.04)'}
          onMouseLeave={e => e.target.style.transform='scale(1)'}
        />
      </div>
    );
  }
  return (
    <div className="placeholder-img" style={style}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style={{opacity:0.28}}>
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="1.5"/>
        <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" strokeWidth="1.5"/>
        <path d="M21 15l-5-5L5 21" stroke="currentColor" strokeWidth="1.5"/>
      </svg>
      <span style={{opacity:0.45, textAlign:'center', padding:'0 12px'}}>{label}</span>
    </div>
  );
}

function FadeIn({ children, delay = 0, style = {} }) {
  const ref = useRef();
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        setTimeout(() => e.target.classList.add('vis'), delay);
        obs.disconnect();
      }
    }, { threshold: 0.08 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className="fade-in" style={style}>{children}</div>;
}

function Counter({ end, suffix = '' }) {
  const [n, setN] = useState(0);
  const ref = useRef();
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        let s = null;
        const step = (ts) => {
          if (!s) s = ts;
          const p = Math.min((ts - s) / 1600, 1);
          setN(Math.floor(p * end));
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
        obs.disconnect();
      }
    });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [end]);
  return <span ref={ref}>{n.toLocaleString()}{suffix}</span>;
}

  const links = [

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  function onChange(k, v) {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    if (k === 'theme') applyTheme(v);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ [k]: v } }, '*');
  }

  useEffect(() => {
    applyTheme(tweaks.theme);
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      else if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav navStyle={tweaks.navStyle}/>
      <Hero heroStyle={tweaks.heroStyle}/>
      <Stats/>
      <About/>
      <Products/>
      <Sustainability/>
      <Gallery/>
      <News/>
      <Careers/>
      <Contact/>
      <Footer/>
      <TweaksPanel tweaks={tweaks} onChange={onChange} open={tweaksOpen}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
