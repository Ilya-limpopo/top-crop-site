<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Crop — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: #f2f7f0; color: #0a2416; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #c8dcc4; border-radius: 2px; }
input[type=text], input[type=email], textarea, select {
  width: 100%; padding: 10px 13px; border: 1px solid #d4e8d0; border-radius: 2px;
  font-size: 14px; font-family: 'DM Sans', sans-serif; color: #0a2416;
  background: #fff; outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: #2b8c30; }
textarea { resize: vertical; line-height: 1.7; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Auth guard ───────────────────────────────────────────────────────────────
if (!sessionStorage.getItem('tc_admin')) {
  window.location.href = 'login.html';
}

// ── Default content ──────────────────────────────────────────────────────────
const DEFAULTS = {
  hero: {
    headline: "From Tanzania's Fertile Soil to the World's Table.",
    sub: "We grow premium bananas and sustainable palm oil across East Africa's most productive land — connecting Tanzanian agriculture to global markets.",
  },
  about: {
    headline: "Rooted in Tanzania, Reaching the World",
    body1: "Founded in 2008, Top Crop is one of East Africa's leading agricultural producers. We operate across Tanzania's most fertile regions — from the slopes of Kilimanjaro to the coastal lowlands — cultivating bananas and oil palms with generational expertise and modern sustainability practices.",
    body2: "Our mission is to produce the finest crops while creating lasting value for local communities, international partners, and our natural environment.",
  },
  products: {
    banana: {
      title: "Premium Bananas",
      body: "Our Cavendish and specialty banana varieties are grown at altitude across Northern Tanzania. Consistent in size, flavor, and shelf-life — ideal for export to Europe, the Middle East, and Asia.",
    },
    palm: {
      title: "Palm Oil",
      body: "Sustainably produced crude and refined palm oil from our coastal and lowland plantations. RSPO-certified, fully traceable from field to barrel, meeting the highest global standards.",
    },
  },
  sustainability: {
    headline: "Growth That Gives Back",
    body: "At Top Crop, sustainability is not a certification — it is how we farm. We report annually against GRI standards and maintain open partnerships with NGOs and government bodies across Tanzania.",
  },
  news: [
    { id: 1, date: "March 2026", cat: "Press Release", title: "Top Crop Expands to Morogoro Region", body: "We announce the acquisition of 800 additional hectares in the Morogoro valley, increasing banana production capacity by 30%." },
    { id: 2, date: "February 2026", cat: "Sustainability", title: "RSPO Certification Renewed for Third Year", body: "Our palm oil division maintained its Roundtable on Sustainable Palm Oil certification following rigorous third-party audits." },
    { id: 3, date: "January 2026", cat: "Partnership", title: "New EU Distribution Agreement Signed", body: "A 3-year supply agreement securing distribution across 12 European countries begins Q2 2026." },
  ],
  careers: [
    { id: 1, title: "Agronomy Manager", location: "Kilimanjaro Region", type: "Full-time" },
    { id: 2, title: "Export Logistics Coordinator", location: "Dar es Salaam", type: "Full-time" },
    { id: 3, title: "Sustainability Analyst", location: "Remote / Arusha", type: "Full-time" },
  ],
  settings: {
    email: "hello@topcrop.tz",
    phone: "+255 27 250 4000",
    hq: "Njiro Hill, Arusha, Tanzania",
    processing: "Tanga Coastal Zone",
  },
  photos: {},
};

function loadContent() {
  try { return JSON.parse(localStorage.getItem('tc_content')) || DEFAULTS; }
  catch { return DEFAULTS; }
}

function saveContent(data) {
  localStorage.setItem('tc_content', JSON.stringify(data));
}

// ── Shared UI ────────────────────────────────────────────────────────────────
const sectionLabel = { fontSize:'10px', letterSpacing:'0.16em', textTransform:'uppercase', color:'#5a9e6a', fontWeight:500, marginBottom:'7px', display:'block' };
const fieldLabel = { fontSize:'10px', letterSpacing:'0.12em', textTransform:'uppercase', color:'#8ab496', marginBottom:'7px', display:'block', marginTop:'18px' };
const cardStyle = { background:'#fff', border:'1px solid #e4ede0', borderRadius:'4px', padding:'28px 32px', marginBottom:'16px' };

function SaveBar({ onSave, saved }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:'12px', marginBottom:'24px' }}>
      {saved && <span style={{ fontSize:'12px', color:'#5a9e6a', letterSpacing:'0.05em' }}>✓ Saved</span>}
      <button onClick={onSave} style={{
        padding:'10px 28px', background:'#f5c800', color:'#1a1100',
        border:'none', borderRadius:'2px', cursor:'pointer',
        fontSize:'11.5px', fontWeight:500, letterSpacing:'0.1em', textTransform:'uppercase',
        fontFamily:'DM Sans,sans-serif', transition:'background 0.15s',
      }}
      onMouseEnter={e=>e.target.style.background='#ffd400'}
      onMouseLeave={e=>e.target.style.background='#f5c800'}>
        Save & Publish
      </button>
    </div>
  );
}

function Field({ label, value, onChange, multiline = false, rows = 3 }) {
  return (
    <div>
      <label style={fieldLabel}>{label}</label>
      {multiline
        ? <textarea rows={rows} value={value} onChange={e => onChange(e.target.value)}>{value}</textarea>
        : <input type="text" value={value} onChange={e => onChange(e.target.value)} />}
    </div>
  );
}

// ── Sections ─────────────────────────────────────────────────────────────────
function ContentSection({ data, onChange }) {
  const set = (path) => (val) => {
    const keys = path.split('.');
    const next = JSON.parse(JSON.stringify(data));
    let obj = next;
    for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
    obj[keys[keys.length - 1]] = val;
    onChange(next);
  };
  return (
    <div>
      <div style={cardStyle}>
        <span style={sectionLabel}>Hero</span>
        <Field label="Headline" value={data.hero.headline} onChange={set('hero.headline')} multiline rows={2}/>
        <Field label="Subtext" value={data.hero.sub} onChange={set('hero.sub')} multiline rows={3}/>
      </div>
      <div style={cardStyle}>
        <span style={sectionLabel}>About</span>
        <Field label="Headline" value={data.about.headline} onChange={set('about.headline')}/>
        <Field label="First paragraph" value={data.about.body1} onChange={set('about.body1')} multiline rows={4}/>
        <Field label="Second paragraph" value={data.about.body2} onChange={set('about.body2')} multiline rows={3}/>
      </div>
      <div style={cardStyle}>
        <span style={sectionLabel}>Products — Bananas</span>
        <Field label="Title" value={data.products.banana.title} onChange={set('products.banana.title')}/>
        <Field label="Description" value={data.products.banana.body} onChange={set('products.banana.body')} multiline rows={4}/>
      </div>
      <div style={cardStyle}>
        <span style={sectionLabel}>Products — Palm Oil</span>
        <Field label="Title" value={data.products.palm.title} onChange={set('products.palm.title')}/>
        <Field label="Description" value={data.products.palm.body} onChange={set('products.palm.body')} multiline rows={4}/>
      </div>
      <div style={cardStyle}>
        <span style={sectionLabel}>Sustainability</span>
        <Field label="Headline" value={data.sustainability.headline} onChange={set('sustainability.headline')}/>
        <Field label="Body text" value={data.sustainability.body} onChange={set('sustainability.body')} multiline rows={3}/>
      </div>
    </div>
  );
}

const PHOTO_SLOTS = [
  ['aerial plantation view', 'Hero — right top'],
  ['banana harvest', 'Hero — right bottom'],
  ['field workers', 'About — left'],
  ['palm nursery', 'About — top right'],
  ['quality check', 'About — bottom right'],
  ['banana bunch close-up', 'Products — Bananas'],
  ['palm fruit cluster', 'Products — Palm Oil'],
  ['ESG annual report', 'Sustainability'],
  ['banana plantation rows', 'Gallery — wide 1'],
  ['palm tree canopy', 'Gallery — 1'],
  ['harvesting team', 'Gallery — 2'],
  ['processing facility', 'Gallery — 3'],
  ['export packaging', 'Gallery — wide 2'],
  ['irrigation system', 'Gallery — 4'],
  ['sunrise over farm', 'Gallery — 5'],
  ['soil sampling', 'Gallery — 6'],
];

function PhotosSection({ data, onChange }) {
  const handleFile = (slot, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const next = { ...data, photos: { ...data.photos, [slot]: e.target.result } };
      onChange(next);
    };
    reader.readAsDataURL(file);
  };
  const removePhoto = (slot) => {
    const next = { ...data, photos: { ...data.photos } };
    delete next.photos[slot];
    onChange(next);
  };
  return (
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
      {PHOTO_SLOTS.map(([slot, label]) => {
        const src = data.photos[slot];
        return (
          <div key={slot} style={{ ...cardStyle, marginBottom:0, padding:'20px' }}>
            <div style={{ fontSize:'10px', letterSpacing:'0.12em', textTransform:'uppercase', color:'#5a9e6a', marginBottom:'12px' }}>{label}</div>
            {src ? (
              <div style={{ position:'relative' }}>
                <img src={src} alt={slot} style={{ width:'100%', aspectRatio:'16/9', objectFit:'cover', borderRadius:'2px', display:'block' }}/>
                <button onClick={() => removePhoto(slot)} style={{
                  position:'absolute', top:'8px', right:'8px',
                  background:'rgba(0,0,0,0.6)', color:'#fff', border:'none',
                  width:'26px', height:'26px', borderRadius:'50%', cursor:'pointer',
                  fontSize:'13px', display:'flex', alignItems:'center', justifyContent:'center',
                  fontFamily:'DM Sans,sans-serif',
                }}>×</button>
              </div>
            ) : (
              <label style={{
                display:'block', aspectRatio:'16/9',
                background: 'repeating-linear-gradient(-45deg, #f4f8f2 0, #f4f8f2 3px, #eaf3e6 3px, #eaf3e6 6px)',
                border:'2px dashed #c4dcc0', borderRadius:'2px', cursor:'pointer',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px',
              }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8ab496" strokeWidth="1.5">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span style={{ fontSize:'11px', color:'#8ab496', letterSpacing:'0.06em' }}>Upload photo</span>
                <input type="file" accept="image/*" style={{ display:'none' }} onChange={e => handleFile(slot, e.target.files[0])}/>
              </label>
            )}
            <div style={{ fontSize:'11px', color:'#aac4b0', marginTop:'8px' }}>{slot}</div>
          </div>
        );
      })}
    </div>
  );
}

function NewsSection({ data, onChange }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ date:'', cat:'', title:'', body:'' });
  const news = data.news || [];

  const startNew = () => { setForm({ date:'', cat:'', title:'', body:'' }); setEditing('new'); };
  const startEdit = (item) => { setForm({...item}); setEditing(item.id); };
  const save = () => {
    let next;
    if (editing === 'new') {
      const id = Date.now();
      next = { ...data, news: [{ ...form, id }, ...news] };
    } else {
      next = { ...data, news: news.map(n => n.id === editing ? { ...form, id: editing } : n) };
    }
    onChange(next); setEditing(null);
  };
  const remove = (id) => onChange({ ...data, news: news.filter(n => n.id !== id) });

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:'16px' }}>
        <button onClick={startNew} style={{ padding:'9px 22px', background:'#2b8c30', color:'#fff', border:'none', borderRadius:'2px', cursor:'pointer', fontSize:'12px', fontWeight:500, letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>
          + Add Article
        </button>
      </div>

      {editing && (
        <div style={{ ...cardStyle, border:'1px solid #b8dcc0' }}>
          <span style={sectionLabel}>{editing === 'new' ? 'New Article' : 'Edit Article'}</span>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
            <div>
              <label style={fieldLabel}>Date</label>
              <input type="text" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} placeholder="April 2026"/>
            </div>
            <div>
              <label style={fieldLabel}>Category</label>
              <input type="text" value={form.cat} onChange={e=>setForm(f=>({...f,cat:e.target.value}))} placeholder="Press Release"/>
            </div>
          </div>
          <label style={fieldLabel}>Title</label>
          <input type="text" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/>
          <label style={fieldLabel}>Body</label>
          <textarea rows={4} value={form.body} onChange={e=>setForm(f=>({...f,body:e.target.value}))}/>
          <div style={{ display:'flex', gap:'10px', marginTop:'16px' }}>
            <button onClick={save} style={{ padding:'9px 22px', background:'#2b8c30', color:'#fff', border:'none', borderRadius:'2px', cursor:'pointer', fontSize:'12px', fontWeight:500, letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>Save</button>
            <button onClick={()=>setEditing(null)} style={{ padding:'9px 22px', background:'transparent', color:'#8ab496', border:'1px solid #d4e8d0', borderRadius:'2px', cursor:'pointer', fontSize:'12px', letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>Cancel</button>
          </div>
        </div>
      )}

      {news.map(item => (
        <div key={item.id} style={{ ...cardStyle, display:'flex', alignItems:'flex-start', gap:'16px' }}>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', gap:'12px', marginBottom:'6px' }}>
              <span style={{ fontSize:'10px', color:'#5a9e6a', letterSpacing:'0.12em', textTransform:'uppercase' }}>{item.cat}</span>
              <span style={{ fontSize:'11px', color:'#aac4b0' }}>{item.date}</span>
            </div>
            <div style={{ fontFamily:'Playfair Display', fontSize:'17px', fontWeight:600, marginBottom:'6px' }}>{item.title}</div>
            <div style={{ fontSize:'13px', color:'#6a8e74', lineHeight:1.7 }}>{item.body}</div>
          </div>
          <div style={{ display:'flex', gap:'8px', flexShrink:0 }}>
            <button onClick={()=>startEdit(item)} style={{ padding:'7px 16px', border:'1px solid #d4e8d0', background:'transparent', color:'#2b8c30', borderRadius:'2px', cursor:'pointer', fontSize:'11px', fontFamily:'DM Sans,sans-serif' }}>Edit</button>
            <button onClick={()=>remove(item.id)} style={{ padding:'7px 16px', border:'1px solid #f5c6c0', background:'transparent', color:'#c0392b', borderRadius:'2px', cursor:'pointer', fontSize:'11px', fontFamily:'DM Sans,sans-serif' }}>Delete</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function CareersSection({ data, onChange }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ title:'', location:'', type:'Full-time' });
  const careers = data.careers || [];

  const startNew = () => { setForm({ title:'', location:'', type:'Full-time' }); setEditing('new'); };
  const startEdit = (item) => { setForm({...item}); setEditing(item.id); };
  const save = () => {
    let next;
    if (editing === 'new') {
      next = { ...data, careers: [...careers, { ...form, id: Date.now() }] };
    } else {
      next = { ...data, careers: careers.map(c => c.id === editing ? { ...form, id: editing } : c) };
    }
    onChange(next); setEditing(null);
  };
  const remove = (id) => onChange({ ...data, careers: careers.filter(c => c.id !== id) });

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:'16px' }}>
        <button onClick={startNew} style={{ padding:'9px 22px', background:'#2b8c30', color:'#fff', border:'none', borderRadius:'2px', cursor:'pointer', fontSize:'12px', fontWeight:500, letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>
          + Add Position
        </button>
      </div>
      {editing && (
        <div style={{ ...cardStyle, border:'1px solid #b8dcc0' }}>
          <span style={sectionLabel}>{editing === 'new' ? 'New Position' : 'Edit Position'}</span>
          <label style={fieldLabel}>Job Title</label>
          <input type="text" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="e.g. Field Manager"/>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
            <div>
              <label style={fieldLabel}>Location</label>
              <input type="text" value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))} placeholder="Arusha"/>
            </div>
            <div>
              <label style={fieldLabel}>Type</label>
              <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={{ padding:'10px 13px', border:'1px solid #d4e8d0', borderRadius:'2px', fontSize:'14px', fontFamily:'DM Sans,sans-serif', background:'#fff', color:'#0a2416' }}>
                {['Full-time','Part-time','Contract','Internship'].map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
          </div>
          <div style={{ display:'flex', gap:'10px', marginTop:'16px' }}>
            <button onClick={save} style={{ padding:'9px 22px', background:'#2b8c30', color:'#fff', border:'none', borderRadius:'2px', cursor:'pointer', fontSize:'12px', fontWeight:500, letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>Save</button>
            <button onClick={()=>setEditing(null)} style={{ padding:'9px 22px', background:'transparent', color:'#8ab496', border:'1px solid #d4e8d0', borderRadius:'2px', cursor:'pointer', fontSize:'12px', letterSpacing:'0.08em', textTransform:'uppercase', fontFamily:'DM Sans,sans-serif' }}>Cancel</button>
          </div>
        </div>
      )}
      {careers.map(item => (
        <div key={item.id} style={{ ...cardStyle, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontSize:'16px', fontWeight:500, marginBottom:'4px' }}>{item.title}</div>
            <div style={{ fontSize:'12px', color:'#8ab496' }}>{item.location} · {item.type}</div>
          </div>
          <div style={{ display:'flex', gap:'8px' }}>
            <button onClick={()=>startEdit(item)} style={{ padding:'7px 16px', border:'1px solid #d4e8d0', background:'transparent', color:'#2b8c30', borderRadius:'2px', cursor:'pointer', fontSize:'11px', fontFamily:'DM Sans,sans-serif' }}>Edit</button>
            <button onClick={()=>remove(item.id)} style={{ padding:'7px 16px', border:'1px solid #f5c6c0', background:'transparent', color:'#c0392b', borderRadius:'2px', cursor:'pointer', fontSize:'11px', fontFamily:'DM Sans,sans-serif' }}>Delete</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function SettingsSection({ data, onChange }) {
  const set = (k) => (v) => onChange({ ...data, settings: { ...data.settings, [k]: v } });
  const s = data.settings;
  return (
    <div style={cardStyle}>
      <span style={sectionLabel}>Company Details</span>
      <Field label="Email" value={s.email} onChange={set('email')}/>
      <Field label="Phone" value={s.phone} onChange={set('phone')}/>
      <Field label="Headquarters" value={s.hq} onChange={set('hq')}/>
      <Field label="Processing facility" value={s.processing} onChange={set('processing')}/>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
const NAV = [
  { id:'content', label:'Content' },
  { id:'photos',  label:'Photos' },
  { id:'news',    label:'News' },
  { id:'careers', label:'Careers' },
  { id:'settings',label:'Settings' },
];

function App() {
  const [section, setSection] = useState('content');
  const [data, setData] = useState(loadContent);
  const [saved, setSaved] = useState(false);

  const handleSave = () => {
    saveContent(data);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  const sectionTitles = { content:'Text Content', photos:'Photos', news:'News Articles', careers:'Open Positions', settings:'Settings' };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      {/* Sidebar */}
      <aside style={{ width:'220px', background:'#fff', borderRight:'1px solid #e4ede0', display:'flex', flexDirection:'column', flexShrink:0 }}>
        <div style={{ padding:'28px 24px 20px' }}>
          <div style={{ fontFamily:'Playfair Display', fontSize:'17px', fontWeight:600, letterSpacing:'0.04em', color:'#0a2416' }}>TOP CROP</div>
          <div style={{ fontSize:'8px', letterSpacing:'0.3em', textTransform:'uppercase', color:'#5a9e6a', marginTop:'2px' }}>Admin Panel</div>
        </div>
        <nav style={{ flex:1, padding:'8px 12px' }}>
          {NAV.map(item => (
            <button key={item.id} onClick={() => setSection(item.id)} style={{
              display:'block', width:'100%', textAlign:'left',
              padding:'10px 14px', border:'none', borderRadius:'3px', cursor:'pointer',
              fontSize:'13.5px', letterSpacing:'0.02em',
              background: section === item.id ? '#eef8e8' : 'transparent',
              color: section === item.id ? '#2b8c30' : '#4a7a58',
              fontWeight: section === item.id ? 500 : 400,
              fontFamily:'DM Sans,sans-serif', marginBottom:'2px',
              transition:'background 0.15s, color 0.15s',
            }}
            onMouseEnter={e=>{ if(section!==item.id){ e.currentTarget.style.background='#f4faf0'; } }}
            onMouseLeave={e=>{ if(section!==item.id){ e.currentTarget.style.background='transparent'; } }}>
              {item.label}
            </button>
          ))}
        </nav>
        <div style={{ padding:'20px 24px', borderTop:'1px solid #e4ede0' }}>
          <a href="../Top Crop.html" target="_blank" style={{ fontSize:'12px', color:'#8ab496', display:'block', marginBottom:'10px', letterSpacing:'0.04em', textDecoration:'none' }}
            onMouseEnter={e=>e.target.style.color='#2b8c30'}
            onMouseLeave={e=>e.target.style.color='#8ab496'}>
            ↗ View Website
          </a>
          <button onClick={() => { sessionStorage.removeItem('tc_admin'); window.location.href='login.html'; }}
            style={{ fontSize:'12px', color:'#aac4b0', background:'none', border:'none', cursor:'pointer', letterSpacing:'0.04em', fontFamily:'DM Sans,sans-serif', padding:0 }}
            onMouseEnter={e=>e.target.style.color='#c0392b'}
            onMouseLeave={e=>e.target.style.color='#aac4b0'}>
            Sign out
          </button>
        </div>
      </aside>

      {/* Main */}
      <main style={{ flex:1, overflow:'auto', padding:'40px 48px' }}>
        <div style={{ maxWidth:'860px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'28px' }}>
            <h1 style={{ fontFamily:'Playfair Display', fontSize:'26px', fontWeight:600 }}>{sectionTitles[section]}</h1>
            <SaveBar onSave={handleSave} saved={saved}/>
          </div>

          {section === 'content'  && <ContentSection  data={data} onChange={setData}/>}
          {section === 'photos'   && <PhotosSection   data={data} onChange={setData}/>}
          {section === 'news'     && <NewsSection     data={data} onChange={setData}/>}
          {section === 'careers'  && <CareersSection  data={data} onChange={setData}/>}
          {section === 'settings' && <SettingsSection data={data} onChange={setData}/>}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
